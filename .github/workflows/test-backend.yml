name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'fastapi_backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'fastapi_backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Backend Deployment Notice
        run: |
          echo "Backend is now deployed on Railway."
          echo "Tests are run as part of the Railway deployment pipeline."
          echo "This workflow is kept for reference but no longer runs tests."
