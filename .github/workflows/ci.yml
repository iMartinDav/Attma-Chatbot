name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  determine_changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'nextjs-frontend/**/*'
              - '!nextjs-frontend/**/*.md'
              - '!nextjs-frontend/docs/**'
            backend:
              - 'fastapi_backend/**/*'
              - '!fastapi_backend/**/*.md'
              - '!fastapi_backend/docs/**'

  frontend_tests:
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: 'nextjs-frontend/pnpm-lock.yaml'
      
      - name: Install dependencies
        working-directory: ./nextjs-frontend
        run: pnpm install --frozen-lockfile
      
      - name: Run linting
        working-directory: ./nextjs-frontend
        run: pnpm run lint
      
      - name: Run tests with coverage
        working-directory: ./nextjs-frontend
        run: pnpm run coverage || echo "No coverage data generated, but continuing anyway"
      
      - name: Check if coverage files exist
        id: check_coverage
        run: |
          if [ -d "nextjs-frontend/coverage" ]; then
            echo "coverage_exists=true" >> $GITHUB_OUTPUT
          else
            echo "coverage_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Coveralls
        if: steps.check_coverage.outputs.coverage_exists == 'true'
        uses: coverallsapp/github-action@v2.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: node-coverage
          parallel: true
      
      - name: Build frontend
        working-directory: ./nextjs-frontend
        run: pnpm run build
  
  backend_tests:
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.backend_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'fastapi_backend/requirements.txt'
      
      - name: Install dependencies
        working-directory: ./fastapi_backend
        run: pip install -r requirements.txt
      
      - name: Lint Python code
        working-directory: ./fastapi_backend
        run: |
          pip install ruff
          ruff check .
      
      - name: Run tests
        working-directory: ./fastapi_backend
        run: pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

  finish:
    name: Coveralls
    needs: [frontend_tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Successful build without coverage
        if: needs.frontend_tests.result == 'success'
        run: echo "Build succeeded, but no coverage data was generated"

      - name: Close parallel build
        if: needs.frontend_tests.result == 'success'
        continue-on-error: true
        uses: coverallsapp/github-action@v2.3.4
        with:
          parallel-finished: true
          carryforward: "node-coverage"
