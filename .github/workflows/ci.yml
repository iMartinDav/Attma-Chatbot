name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  determine_changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'nextjs-frontend/**/*'
              - '!nextjs-frontend/**/*.md'
              - '!nextjs-frontend/docs/**'

  frontend_tests:
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      
      - name: Install dependencies
        working-directory: ./nextjs-frontend
        run: bun install --frozen-lockfile
      
      - name: Run linting
        working-directory: ./nextjs-frontend
        run: bun run lint
      
      - name: Run tests with coverage
        working-directory: ./nextjs-frontend
        run: bun run coverage || echo "No coverage data generated, but continuing anyway"
      
      - name: Check if coverage files exist
        id: check_coverage
        run: |
          if [ -d "nextjs-frontend/coverage" ]; then
            echo "coverage_exists=true" >> $GITHUB_OUTPUT
          else
            echo "coverage_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Coveralls
        if: steps.check_coverage.outputs.coverage_exists == 'true'
        uses: coverallsapp/github-action@v2.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: node-coverage
          parallel: true
      
      - name: Build frontend
        working-directory: ./nextjs-frontend
        run: bun run build:skip-migrate
  
  finish:
    name: Coveralls
    needs: [frontend_tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Successful build without coverage
        if: needs.frontend_tests.result == 'success'
        run: echo "Build succeeded, but no coverage data was generated"

      - name: Close parallel build
        if: needs.frontend_tests.result == 'success'
        continue-on-error: true
        uses: coverallsapp/github-action@v2.3.4
        with:
          parallel-finished: true
          carryforward: "node-coverage"
