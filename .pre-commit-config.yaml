fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^nextjs-frontend/bun\.lock$
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key

  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint
        entry: sh -c 'cd nextjs-frontend && bun run lint'
        language: system
        files: ^nextjs-frontend/.*\.(js|jsx|ts|tsx|mjs)$
        pass_filenames: false
      - id: frontend-format
        name: Prettier
        entry: sh -c 'cd nextjs-frontend && bun run format:check'
        language: system
        files: ^nextjs-frontend/
        pass_filenames: false
      - id: frontend-tsc
        name: TypeScript
        entry: sh -c 'cd nextjs-frontend && bunx tsc --noEmit -p .'
        language: system
        files: ^nextjs-frontend/.*\.(ts|tsx)$
        pass_filenames: false
