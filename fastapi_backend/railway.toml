[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level $LOG_LEVEL"
healthcheckPath = "/health"
healthcheckTimeout = 10
healthcheckInterval = 30

[http]
bodyLimit = "300mb"
compress = true
readTimeout = "60s"
writeTimeout = "60s"

[env]
RAILWAY_ENVIRONMENT = "production"
FILE_UPLOAD_MAX_SIZE_MB = "300"
PORT = "8000"
LOG_LEVEL = "info"
PYTHON_VERSION = "3.11"
