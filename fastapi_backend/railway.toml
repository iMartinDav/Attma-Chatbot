[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --log-level ${LOG_LEVEL:-info}"

[http]
bodyLimit = "300mb"
readTimeout = "60s"
writeTimeout = "60s"

[env]
RAILWAY_ENVIRONMENT = "production"
FILE_UPLOAD_MAX_SIZE_MB = "300"
PYTHON_VERSION = "3.11"
