[project]
name = "attma-backend-chatbot"
version = "0.0.2"
description = "FastAPI backend for nextjs-fastapi project"
authors = [{ name = "Anderson Resende", email = "anderson@vinta.com.br" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi[standard]>=0.115.0,<0.116",
    "asyncpg>=0.29.0,<0.30",
    "fastapi-users[sqlalchemy]>=13.0.0,<14",
    "pydantic-settings>=2.5.2,<3",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pathlib>=1.0.1",
    "python-multipart>=0.0.7",
    "uvicorn[standard]>=0.27.1,<0.28",
    "python-dotenv>=1.0.1,<2",
    "alembic>=1.14.0,<2",
    "aiohttp",
    # Using a compatible version for vercel-blob
    "vercel-blob>=0.4.0",
    "scanpy>=1.9.0,<2.0",
    "anndata>=0.10.0,<0.11",
    "plotly>=5.14.0,<6.0",
    "python-jose[cryptography]>=3.3.0,<4", # Added for JWT authentication
    "passlib[bcrypt]>=1.7.4,<2",          # Added for password hashing
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.4.0,<4",
    "ruff>=0.1.0,<0.2",
    "watchdog>=5.0.3,<6",
    "pytest>=8.3.3,<9",
    "pytest-mock>=3.14.0,<4",
    "mypy>=1.13.0,<2",
    "coveralls>=4.0.1,<5",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=4.1.0,<5",
    "pytest-watch>=4.2.0,<5",
]

test = [
    "pytest>=8.3.3,<9",
    "pytest-mock>=3.14.0,<4",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=4.1.0,<5",
]

# Add these convenience scripts
[project.scripts]
run-api = "app.main:start"
run-tests = "commands.run_tests:main"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "B", "I"]
ignore = ["E203"]

[tool.ruff.isort]
known-first-party = ["app", "tests", "commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "api: marks tests as API tests",
    "unit: marks tests as unit tests",
    "bioflow: marks tests as bioflow tests",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_explicit = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
