services:
  db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Add initialization scripts for Drizzle schema
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./nextjs-frontend
      args:
        - DOCKER_BUILD=true
        - NEXT_TELEMETRY_DISABLED=1
    container_name: nextjs-frontend
    restart: unless-stopped
    user: node
    ports:
      - "3000:3000"
    networks:
      - my_network
    environment:
      NODE_ENV: development
      DOCKER_BUILD: "true"
      NEXT_TELEMETRY_DISABLED: 1
      # Email service - use dummy values for development
      RESEND_API_KEY: dummy_key_for_local_dev
      EMAIL_FROM: no-reply@example.com
      # Database connection
      DATABASE_URL: postgresql://postgres:password@db:5432/mydatabase
      POSTGRES_URL: postgresql://postgres:password@db:5432/mydatabase
      # NextAuth configuration
      NEXTAUTH_SECRET: dev_nextauth_secret_do_not_use_in_production
      NEXTAUTH_URL: http://localhost:3000
    volumes:
      - ./nextjs-frontend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: postgres-data

networks:
  my_network:
    driver: bridge
    name: app-network
