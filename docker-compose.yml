services:
  backend:
    build:
      context: fastapi_backend
    container_name: fastapi-backend
    restart: unless-stopped
    environment:
      - DEV=true
      - OPENAPI_OUTPUT_FILE=./shared-data/openapi.json
      # Use non-SQLAlchemy format for Drizzle compatibility
      - DATABASE_URL=postgresql://postgres:password@db:5432/mydatabase
      - TEST_DATABASE_URL=postgresql://postgres:password@db:5433/testdatabase
      # Authentication secrets
      - ACCESS_SECRET_KEY=dev_secret_key_do_not_use_in_production
      - RESET_PASSWORD_SECRET_KEY=dev_reset_key_do_not_use_in_production
      - VERIFICATION_SECRET_KEY=dev_verification_key_do_not_use_in_production
      # CORS settings
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=["http://localhost:3000"]
      # Other settings
      - MAIL_SERVER=mailhog
      - PYTHONPATH=/app
      - SINGLE_CELL_DATA_DIR=/app/shared-data/single_cell_data
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    networks:
      - my_network
    volumes:
      - ./fastapi_backend:/app
      - fastapi-venv:/app/.venv
      - ./local-shared-data:/app/shared-data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Use more tolerant health check that accepts any response
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Add initialization scripts for Drizzle schema
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  db_test:
    image: postgres:17-alpine
    container_name: postgres-db-test
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdatabase
    ports:
      - "5433:5432"
    networks:
      - my_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./nextjs-frontend
    container_name: nextjs-frontend
    restart: unless-stopped
    user: node
    ports:
      - "3000:3000"
    networks:
      - my_network
    environment:
      NODE_ENV: development
      # Use same database URL for Drizzle ORM
      DATABASE_URL: postgresql://postgres:password@db:5432/mydatabase
      API_BASE_URL: http://backend:8000
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
      # NextAuth configuration
      NEXTAUTH_SECRET: dev_nextauth_secret_do_not_use_in_production
      NEXTAUTH_URL: http://localhost:3000
      BACKEND_URL: http://backend:8000
    volumes:
      - ./nextjs-frontend:/app
      - ./nextjs-frontend/node_modules:/app/node_modules
      - ./local-shared-data:/app/shared-data
    depends_on:
      backend:
        condition: service_healthy
  mailhog:
    image: mailhog/mailhog
    container_name: mail-server
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - my_network

volumes:
  postgres_data:
    name: postgres-data
  fastapi-venv:
    name: fastapi-virtualenv
  nextjs-node-modules:
    name: nextjs-modules

networks:
  my_network:
    driver: bridge
    name: app-network